services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: estatepulse_sqlserver
    user: "0:0"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=EstatePulse@2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
    restart: unless-stopped

volumes:
  sqlserver_data: